name: QA Run

# Revalor QA suite (qa/, Playwright). Started from /admin/qa via the GitHub
# API (workflow_dispatch) -- see lib/qa/github.ts -- and nightly on a schedule.
# Results stream back to /api/admin/qa/report as each test finishes; see
# docs/qa-suite.md.
#
# Repo secrets: QA_REPORT_SECRET; VisionWorkx: MODULES_SUPABASE_URL,
# MODULES_SUPABASE_SERVICE_ROLE_KEY, NEXT_PUBLIC_MODULES_SUPABASE_ANON_KEY;
# Sanctum: SANCTUM_SUPABASE_URL, SANCTUM_SUPABASE_SERVICE_ROLE_KEY;
# Proactive: PROACTIVE_SUPABASE_URL, PROACTIVE_SUPABASE_SERVICE_ROLE_KEY;
# kids apps: CHOREBIT_/FEELFLOW_/MINDBIT_SUPABASE_URL and _SUPABASE_SERVICE_ROLE_KEY;
# Christian Friends Hub: CFH_SUPABASE_URL, CFH_SUPABASE_SERVICE_ROLE_KEY.
# Optional: VERCEL_AUTOMATION_BYPASS_SECRET (protected previews).
# Repo variable (optional): QA_REPORT_URL, default https://vision-workx.vercel.app.
on:
  # Nightly: every test of every product (qa/products.json), against
  # production, 11:00 UTC (7 am Eastern). A failing nightly run emails the
  # operator (lib/qa/notify.ts); /admin/qa shows it as "nightly".
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "vw_qa_runs id (set by /admin/qa; blank = create one)"
        required: false
        default: ""
      product:
        description: "Product slug (blank = every product)"
        required: false
        default: ""
      target_url:
        description: "Site to test (blank = the product's production URL)"
        required: false
        default: ""
      target_env:
        description: "production or preview"
        required: false
        default: "production"
      grep:
        description: "Playwright --grep (blank = all tests)"
        required: false
        default: ""

jobs:
  products:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: qa/products.json
          sparse-checkout-cone-mode: false
      - id: list
        run: echo "list=$(jq -c 'keys' qa/products.json)" >> "$GITHUB_OUTPUT"

  qa:
    needs: products
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # One product when started from /admin/qa; every product in qa/products.json nightly.
        product: ${{ fromJSON(inputs.product && format('["{0}"]', inputs.product) || needs.products.outputs.list) }}
    concurrency:
      group: qa-${{ matrix.product }}-${{ inputs.run_id || github.run_id }}
    env:
      CI: "true"
      QA_RUN_ID: ${{ inputs.run_id }}
      QA_PRODUCT: ${{ matrix.product }}
      QA_TARGET_URL: ${{ inputs.target_url }}
      QA_TARGET_ENV: ${{ inputs.target_env || 'production' }}
      QA_REPORT_URL: ${{ vars.QA_REPORT_URL || 'https://vision-workx.vercel.app' }}
      QA_REPORT_SECRET: ${{ secrets.QA_REPORT_SECRET }}
      MODULES_SUPABASE_URL: ${{ secrets.MODULES_SUPABASE_URL }}
      MODULES_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MODULES_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_MODULES_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_MODULES_SUPABASE_ANON_KEY }}
      SANCTUM_SUPABASE_URL: ${{ secrets.SANCTUM_SUPABASE_URL }}
      SANCTUM_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SANCTUM_SUPABASE_SERVICE_ROLE_KEY }}
      PROACTIVE_SUPABASE_URL: ${{ secrets.PROACTIVE_SUPABASE_URL }}
      PROACTIVE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROACTIVE_SUPABASE_SERVICE_ROLE_KEY }}
      CHOREBIT_SUPABASE_URL: ${{ secrets.CHOREBIT_SUPABASE_URL }}
      CHOREBIT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CHOREBIT_SUPABASE_SERVICE_ROLE_KEY }}
      FEELFLOW_SUPABASE_URL: ${{ secrets.FEELFLOW_SUPABASE_URL }}
      FEELFLOW_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.FEELFLOW_SUPABASE_SERVICE_ROLE_KEY }}
      MINDBIT_SUPABASE_URL: ${{ secrets.MINDBIT_SUPABASE_URL }}
      MINDBIT_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MINDBIT_SUPABASE_SERVICE_ROLE_KEY }}
      CFH_SUPABASE_URL: ${{ secrets.CFH_SUPABASE_URL }}
      CFH_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CFH_SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Stripe SANDBOX key for billing tests (preview runs only; qa/lib/stripe.ts refuses live keys).
      STRIPE_TEST_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: supabase-js (used by the test helpers) needs Node's native WebSocket.
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Billing tests (VisionWorkx, preview only): forward the Stripe SANDBOX's
      # webhooks to the preview being tested. The preview's STRIPE_WEBHOOK_SECRET
      # is this CLI's signing secret (its fingerprint is printed to compare).
      - name: Forward Stripe sandbox webhooks
        if: matrix.product == 'visionworkx' && env.QA_TARGET_ENV == 'preview' && env.STRIPE_TEST_SECRET_KEY != ''
        run: |
          case "$STRIPE_TEST_SECRET_KEY" in sk_test_*|rk_test_*) ;; *) echo "STRIPE_TEST_SECRET_KEY is not a test key -- refusing"; exit 1;; esac
          npm i -g @stripe/cli >/dev/null 2>&1
          echo "stripe listen signing-secret fingerprint: $(stripe listen --print-secret --api-key "$STRIPE_TEST_SECRET_KEY" | tr -d '\r\n' | sha256sum | cut -c1-12)"
          EXTRA=()
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then EXTRA=(--headers "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"); fi
          # The events app/api/webhooks/stripe handles.
          EVENTS=checkout.session.completed,customer.subscription.created,customer.subscription.updated,customer.subscription.deleted,invoice.paid,invoice.payment_failed,account.updated
          nohup stripe listen --api-key "$STRIPE_TEST_SECRET_KEY" --events "$EVENTS" --forward-to "$QA_TARGET_URL/api/webhooks/stripe" "${EXTRA[@]}" > "$RUNNER_TEMP/stripe-listen.log" 2>&1 &
          PID=$!
          sleep 8
          grep -v -i "whsec" "$RUNNER_TEMP/stripe-listen.log" | head -5
          kill -0 "$PID" || { echo "stripe listen isn't running"; exit 1; }
      - name: Sync test catalog
        # A catalog problem shouldn't stop the tests themselves from running.
        continue-on-error: true
        run: node qa/sync-catalog.mjs
      - name: Run tests
        env:
          QA_GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$QA_GREP" ]; then
            npx playwright test -c qa/playwright.config.ts --grep "$QA_GREP"
          else
            npx playwright test -c qa/playwright.config.ts
          fi
      - name: Stripe webhook deliveries
        if: always() && matrix.product == 'visionworkx' && env.QA_TARGET_ENV == 'preview' && env.STRIPE_TEST_SECRET_KEY != ''
        run: grep -v -i "whsec" "$RUNNER_TEMP/stripe-listen.log" | tail -40 || true
      # If setup failed before Playwright could report, don't leave the run "queued" forever.
      - name: Report setup failure
        if: failure() && inputs.run_id != ''
        run: |
          SECRET=$(printf '%s' "$QA_REPORT_SECRET" | sed $'s/^\xef\xbb\xbf//' | tr -d '\r\n ')
          curl -sS -X POST "$QA_REPORT_URL/api/admin/qa/report" \
            -H "Authorization: Bearer $SECRET" -H "Content-Type: application/json" \
            -d "{\"type\":\"end\",\"runId\":\"$QA_RUN_ID\",\"status\":\"failed\",\"error\":\"The QA workflow failed during setup or a test errored. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" || true
