name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: templates/base drift check
        # baseTemplate.generated.ts is committed (the deploy function can't
        # read the filesystem at runtime) but hand-derived from templates/base/**.
        # Catch the case where someone edits the source and forgets `npm run
        # gen:base` — patchFiles() would silently deploy the stale version.
        run: |
          npm run gen:base
          git diff --exit-code lib/apps/baseTemplate.generated.ts || {
            echo "::error::lib/apps/baseTemplate.generated.ts is stale — run 'npm run gen:base' and commit the result.";
            exit 1;
          }
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build
        env:
          # Build-time only; real values live in Vercel. Placeholders keep
          # `next build` from failing on missing NEXT_PUBLIC_* reads.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_APP_URL: https://vision-workx.vercel.app
