name: Supabase keep-alive

# Supabase's free plan pauses a project after 7 days without database
# activity. This makes one small read against each free-plan project every
# day so they stay active. If a project is paused or not answering, the run
# fails and GitHub emails the repo owner.
#
# Per project: a matrix entry (ref + secret name) and a GitHub secret holding
# that project's anon/public key (read-only; it's already public in the app's
# browser code). Only that project's key is passed to its job.
on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: kkpwgnmhtcidnrnlwcll
            secret: SUPABASE_ANON_KEY_KKPWGNMHTCIDNRNLWCLL
          - ref: uclbxwblhtiearljgats
            secret: SUPABASE_ANON_KEY_UCLBXWBLHTIEARLJGATS
    steps:
      - name: Read from ${{ matrix.ref }}
        env:
          REF: ${{ matrix.ref }}
          SECRET_NAME: ${{ matrix.secret }}
          KEY_RAW: ${{ secrets[matrix.secret] }}
        run: |
          # Strip a stray byte-order mark / whitespace if the secret was pasted with one.
          KEY=$(printf '%s' "$KEY_RAW" | sed $'s/^\xef\xbb\xbf//' | tr -d '\r\n ')
          if [ -z "$KEY" ]; then echo "::error::Missing GitHub secret $SECRET_NAME"; exit 1; fi
          URL="https://$REF.supabase.co"
          # The REST root lists the schema -- a real (read-only) query against the database.
          CODE=$(curl -s -o root.json -w '%{http_code}' --max-time 30 "$URL/rest/v1/" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          if [ "$CODE" != "200" ]; then
            echo "::error::$REF answered HTTP $CODE -- it may be paused. Restore it at https://supabase.com/dashboard/project/$REF"
            head -c 300 root.json; echo
            exit 1
          fi
          # Also read one row from the first table, as an ordinary query (RLS may return nothing; that's fine).
          TABLE=$(jq -r '.paths | keys[] | select(. != "/" and (startswith("/rpc/") | not))' root.json | head -1)
          if [ -n "$TABLE" ]; then
            T=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/rest/v1${TABLE}?select=*&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "$REF: schema read OK, ${TABLE#/} read -> HTTP $T"
          else
            echo "$REF: schema read OK"
          fi
